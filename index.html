/* ============ backup: JSON in/out, CSV out ============ */
function stamp(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
async function saveFile(filename, data){
  let dl = null;
  try { dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; } catch(_){}
  if (dl){
    try { await dl.save({filename, data}); return "saved"; }
    catch(err){ if (err && err.code === "declined") return "declined"; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], {type:"text/plain;charset=utf-8"}));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(_){}
  return "fallback";
}
function copySheet(title, hint, text){
  const sheet = openSheet("<h3>" + esc(title) + "</h3><p class='hint'>" + hint + "</p>" +
    '<textarea class="pastebox" id="copyBox" readonly></textarea>' +
    '<div class="actions"><button class="btn ghostbtn" data-close>Close</button><button class="btn primary" data-copy>Copy</button></div>');
  const box = sheet.querySelector("#copyBox");
  box.value = text;
  sheet.querySelector("[data-close]").onclick = closeSheet;
  sheet.querySelector("[data-copy]").onclick = () => {
    box.select();
    try { navigator.clipboard.writeText(text); } catch(_){ try { document.execCommand("copy"); } catch(_2){} }
    sheet.querySelector("[data-copy]").textContent = "Copied";
  };
}
async function exportJSON(){
  const text = JSON.stringify(DB, null, 2);
  const name = "local-pages-backup-" + stamp() + ".json";
  const r = await saveFile(name, text);
  if (r === "fallback") copySheet("Backup", "If the download didn't start, copy this and save it as a <b>.json</b> file. Restoring it puts everything back exactly as it is now.", text);
}
function csvCell(v){
  v = v == null ? "" : String(v);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function buildCSV(){
  const rows = [["Folder","Month","Submission","Code","Edition","Phase","Step","Type","Progress %","Date","Comments"]];
  DB.folders.forEach(f => monthsIn(f.id).forEach(m => {
    (m.editions || []).forEach(eid => {
      const ed = edById(eid); if (!ed) return;
      const c = (DB.data[m.id] || {})[eid]; if (!c) return;
      DB.phases.forEach(ph => stepsOf(ph.id).forEach(st => {
        const notes = (c.notes[st.id] || []).map(n => (n.by ? n.by + ": " : "") + n.text).join("  |  ");
        rows.push([f.name, m.label, m.submitted || "", ed.code || "", ed.name, ph.name, st.label,
          st.type === "status" ? "progress" : "date",
          st.type === "status" ? (c.status[st.id] || 0) : "",
          st.type === "date" ? (c.dates[st.id] || "") : "",
          notes]);
      }));
      const en = (c.note || []).map(n => (n.by ? n.by + ": " : "") + n.text).join("  |  ");
      if (en) rows.push([f.name, m.label, m.submitted || "", ed.code || "", ed.name, "", "Notes for this edition", "note", "", "", en]);
    });
  }));
  return "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}
async function exportCSV(){
  const text = buildCSV();
  const name = "local-pages-" + stamp() + ".csv";
  const r = await saveFile(name, text);
  if (r === "fallback") copySheet("Spreadsheet export", "If the download didn't start, copy this and save it as a <b>.csv</b> file, then open it in Excel.", text);
}
function applyImport(text){
  let incoming;
  try { incoming = JSON.parse(text); }
  catch(e){ return "That isn't valid JSON — make sure you copied the whole file."; }
  if (!incoming || !Array.isArray(incoming.issues) || !Array.isArray(incoming.editions) || !incoming.data)
    return "That JSON isn't a Local Pages backup.";
  const months = incoming.issues.length, eds = incoming.editions.length;
  confirmAsk("Restore this backup?",
    "It holds " + months + " month" + (months === 1 ? "" : "s") + " and " + eds + " edition" + (eds === 1 ? "" : "s") +
    ". Everything currently in this browser is replaced by it. This can't be undone — take a backup of what's here first if you're not sure.",
    "Replace everything", () => {
      DB = incoming;
      current = DB.issues.length ? DB.issues[DB.issues.length - 1].id : null;
      open = new Set(); openPhase.clear(); lastIssuePct = -1;
      ensureCells(); save(); closeSheet(); renderAll();
    });
  return null;
}
function importSheet(){
  const sheet = openSheet("<h3>Restore from backup</h3>" +
    "<p class='hint'>Pick a backup file, or paste its contents below. Everything currently in this browser is replaced.</p>" +
    '<div class="filerow"><input type="file" id="impFile" accept=".json,application/json"></div>' +
    '<textarea class="pastebox" id="impBox" placeholder=\'{ "folders": [ ... ] }\'></textarea>' +
    '<div class="actions"><button class="btn ghostbtn" data-close>Cancel</button><button class="btn primary" data-go>Restore</button></div>');
  sheet.querySelector("[data-close]").onclick = closeSheet;
  const box = sheet.querySelector("#impBox");
  const file = sheet.querySelector("#impFile");
  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { box.value = String(r.result || ""); };
    r.readAsText(f);
  };
  sheet.querySelector("[data-go]").onclick = () => {
    const err = applyImport(box.value.trim());
    if (err) showErr(sheet, err);
  };
}

  if (!m) return;
  m.textContent = text || "";
  m.className = "gate-msg" + (kind ? " " + kind : "");
}

/* ---------- reading ---------- */
async function loadAll(){
  setLive("busy");
  const q = t => sb.from(t).select("*");
  const [folders, months, editions, monthEds, phases, steps, entries, comments, profiles] =
    await Promise.all(["folders","months","editions","month_editions","phases","steps",
                       "entries","comments","profiles"].map(q));
  const bad = [folders, months, editions, monthEds, phases, steps, entries, comments, profiles]
    .find(r => r.error);
  if (bad){ setLive("off"); throw bad.error; }

  const bySort = (a, b) => (a.sort || 0) - (b.sort || 0);
  const db = {
    folders: folders.data.sort(bySort).map(f => ({id:f.id, name:f.name, color:f.color || ""})),
    editions: editions.data.sort(bySort).map(e => ({
      id:e.id, name:e.name, code:e.code || "", place:e.place || "",
      flag:e.flag || null, std:!!e.std
    })),
    phases: phases.data.sort(bySort).map(p => ({id:p.id, name:p.name, color:p.color || ""})),
    steps: steps.data.sort(bySort).map(s => ({
      id:s.id, phase:s.phase_id, label:s.label, type:s.type, done:s.done_word || "Done"
    })),
    issues: [], data: {},
    me: {name:(ME && ME.name) || ""},
    people: [], peopleColors: {}, peopleAvatars: {}
  };

  PROFILES = profiles.data.slice().sort((a, b) => (a.color_index || 0) - (b.color_index || 0));
  PROFILES.forEach(p => {
    const nm = (p.name || p.email || "").trim();
    if (!nm) return;
    db.people.push(nm);
    db.peopleColors[nm.toLowerCase()] = PERSON_COLORS[(p.color_index || 0) % PERSON_COLORS.length];
    if (p.avatar) db.peopleAvatars[nm.toLowerCase()] = p.avatar;
  });

  const edsFor = {};
  monthEds.data.sort(bySort).forEach(r => { (edsFor[r.month_id] = edsFor[r.month_id] || []).push(r.edition_id); });
  db.issues = months.data.sort(bySort).map(m => ({
    id:m.id, folder:m.folder_id, label:m.label, submitted:m.submitted || "",
    color:m.color || "", editions:(edsFor[m.id] || []).slice()
  }));
  db.issues.forEach(m => { db.data[m.id] = {}; });

  const blankCell = () => {
    const c = {status:{}, dates:{}, notes:{}, note:[]};
    db.steps.forEach(s => { if (s.type === "status") c.status[s.id] = 0; else c.dates[s.id] = ""; c.notes[s.id] = []; });
    return c;
  };
  db.issues.forEach(m => (edsFor[m.id] || []).forEach(eid => { db.data[m.id][eid] = blankCell(); }));

  entries.data.forEach(r => {
    const cell = db.data[r.month_id] && db.data[r.month_id][r.edition_id];
    if (!cell) return;
    if (r.progress !== null && r.progress !== undefined) cell.status[r.step_id] = r.progress;
    if (r.on_date) cell.dates[r.step_id] = r.on_date;
  });
  comments.data.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at))).forEach(r => {
    const cell = db.data[r.month_id] && db.data[r.month_id][r.edition_id];
    if (!cell) return;
    const entry = {id:r.id, by:r.author_name || "", at:r.created_at, text:r.body};
    if (r.step_id){ (cell.notes[r.step_id] = cell.notes[r.step_id] || []).push(entry); }
    else cell.note.push(entry);
  });

  DB = db;
  if (!current || !DB.issues.some(i => i.id === current))
    current = DB.issues.length ? DB.issues[DB.issues.length - 1].id : null;
  setLive("");
}

/* ---------- writing ---------- */
let pushTimer = null, pushing = false;
function queueStructurePush(){
  if (!CAN_EDIT) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { pushStructure(); }, 400);
}
async function pushStructure(){
  if (!CAN_EDIT || pushing) return;
  pushing = true; setLive("busy");
  try {
    const idx = (arr, extra) => arr.map((o, i) => Object.assign({sort:i}, extra ? extra(o) : o));
    await sb.from("folders").upsert(DB.folders.map((f, i) => ({id:f.id, name:f.name, color:f.color || "", sort:i})));
    await sb.from("editions").upsert(DB.editions.map((e, i) => ({
      id:e.id, name:e.name, code:e.code || "", place:e.place || "",
      flag:e.flag || null, std:!!e.std, sort:i})));
    await sb.from("phases").upsert(DB.phases.map((p, i) => ({id:p.id, name:p.name, color:p.color || "", sort:i})));
    await sb.from("steps").upsert(DB.steps.map((s, i) => ({
      id:s.id, phase_id:s.phase, label:s.label, type:s.type, done_word:s.done || "Done", sort:i})));
    await sb.from("months").upsert(DB.issues.map((m, i) => ({
      id:m.id, folder_id:m.folder, label:m.label, submitted:m.submitted || null,
      color:m.color || "", sort:i})));

    const wanted = [];
    DB.issues.forEach(m => m.editions.forEach((eid, i) => wanted.push({month_id:m.id, edition_id:eid, sort:i})));
    await sb.from("month_editions").upsert(wanted);

    /* remove anything that is no longer here */
    const keep = (t, ids) => ids.length
      ? sb.from(t).delete().not("id", "in", "(" + ids.map(x => JSON.stringify(x)).join(",") + ")")
      : Promise.resolve();
    await keep("folders",  DB.folders.map(f => f.id));
    await keep("months",   DB.issues.map(m => m.id));
    await keep("editions", DB.editions.map(e => e.id));
    await keep("phases",   DB.phases.map(p => p.id));
    await keep("steps",    DB.steps.map(s => s.id));

    const all = await sb.from("month_editions").select("month_id,edition_id");
    if (!all.error){
      const want = new Set(wanted.map(w => w.month_id + "|" + w.edition_id));
      for (const r of all.data){
        if (!want.has(r.month_id + "|" + r.edition_id))
          await sb.from("month_editions").delete().eq("month_id", r.month_id).eq("edition_id", r.edition_id);
      }
    }
    setLive("");
  } catch(err){
    console.error("push failed", err);
    setLive("off");
  } finally { pushing = false; }
}

async function pushEntry(monthId, edId, stepId, patch){
  if (!CAN_EDIT) return;
  const row = Object.assign({month_id:monthId, edition_id:edId, step_id:stepId,
                             updated_at:new Date().toISOString(), updated_by:ME && ME.id}, patch);
  const {error} = await sb.from("entries").upsert(row, {onConflict:"month_id,edition_id,step_id"});
  if (error){ console.error(error); setLive("off"); }
}
async function pushComment(entry, monthId, edId, stepId){
  if (!CAN_EDIT) return;
  const {error} = await sb.from("comments").insert({
    id:entry.id, month_id:monthId, edition_id:edId, step_id:stepId || null,
    body:entry.text, author:ME && ME.id, author_name:entry.by, created_at:entry.at});
  if (error){ console.error(error); setLive("off"); }
}
async function dropComment(id){
  if (!CAN_EDIT) return;
  const {error} = await sb.from("comments").delete().eq("id", id);
  if (error) console.error(error);
}
async function logHistory(what, ids, detail){
  if (!CAN_EDIT) return;
  await sb.from("history").insert({
    actor:ME && ME.id, actor_name:(ME && ME.name) || "",
    month_id:(ids && ids.month) || null, edition_id:(ids && ids.edition) || null,
    step_id:(ids && ids.step) || null, what, detail:detail || null});
}

/* ---------- live ---------- */
let reloadTimer = null;
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    if (dragCtx || !document.getElementById("scrim").hidden || !document.getElementById("scrim2").hidden ||
        (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))){
      scheduleReload();
      return;
    }
    const keepOpen = new Set(open), keepPhase = new Set(openPhase), y = window.scrollY;
    try { await loadAll(); } catch(e){ setLive("off"); return; }
    open = keepOpen; openPhase.clear(); keepPhase.forEach(k => openPhase.add(k));
    renderAll();
    window.scrollTo(0, y);
  }, 500);
}
function listen(){
  if (LIVE) sb.removeChannel(LIVE);
  LIVE = sb.channel("localpages")
    .on("postgres_changes", {event:"*", schema:"public"}, payload => {
      if (payload.table === "history") return;
      /* Somebody else moved something: glow it, so the change is seen
         rather than just silently appearing. Our own writes are skipped. */
      if (payload.table === "entries"){
        const row = payload.new || payload.old || {};
        if (row.updated_by && ME && row.updated_by !== ME.id) flashStep(row);
      }
      scheduleReload();
    })
    .subscribe(status => { setLive(status === "SUBSCRIBED" ? "" : "busy"); });
}

/* Mark a step as just-touched. The re-render lands a moment later and
   wipes the class, so the mark is re-applied after it settles too. */
let flashQueue = [];
function flashStep(row){
  const key = row.month_id + "|" + row.edition_id + "|" + row.step_id;
  if (flashQueue.indexOf(key) < 0) flashQueue.push(key);
  paintFlashes();
  setTimeout(paintFlashes, 700);
  setTimeout(() => {
    flashQueue = flashQueue.filter(k => k !== key);
  }, 3200);
}
function paintFlashes(){
  flashQueue.forEach(key => {
    const [m, e, s] = key.split("|");
    if (m !== current) return;
    const el = document.querySelector('[data-flash="' + e + "|" + s + '"]');
    if (el && !el.classList.contains("just-touched")){
      el.classList.add("just-touched");
      setTimeout(() => el.classList.remove("just-touched"), 2900);
    }
  });
}

/* ---------- who else is here ---------- */
function joinPresence(){
  if (HERE) sb.removeChannel(HERE);
  if (!ME) return;
  HERE = sb.channel("who", {config:{presence:{key:ME.id}}});
  HERE.on("presence", {event:"sync"}, () => {
      const state = HERE.presenceState();
      const seen = {};
      Object.keys(state).forEach(id => {
        const meta = (state[id] || [])[0];
        if (meta && !seen[id]) seen[id] = {id, name:meta.name || "", at:meta.at};
      });
      ONLINE = Object.values(seen);
      paintPresence();
    })
    .subscribe(async status => {
      if (status === "SUBSCRIBED")
        await HERE.track({name:ME.name || "", at:new Date().toISOString()});
    });
}
function paintPresence(){
  const el = document.getElementById("presence");
  if (!el) return;
  /* Me first, then everyone else, oldest arrival first so the row is stable. */
  const others = ONLINE.filter(p => !ME || p.id !== ME.id)
                       .sort((a, b) => String(a.at).localeCompare(String(b.at)));
  el.innerHTML = others.map(p => avatarHTML(p.name, 26)).join("");
  el.title = others.length
    ? others.map(p => p.name).join(", ") + (others.length === 1 ? " is here too" : " are here too")
    : "";
}

/* ---------- sign in ---------- */
async function afterSignIn(session){
  const {data, error} = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error){
    console.error(error);
    gateMsg("Signed in, but the database refused to load your profile: " + error.message, "bad");
    return;
  }
  ME = data || {id:session.user.id, name:session.user.email.split("@")[0], is_admin:false, color_index:0};
  CAN_EDIT = !!ME.is_admin;
  document.body.classList.toggle("readonly", !CAN_EDIT);

  try { await loadAll(); }
  catch(err){
    console.error(err);
    gateMsg("Signed in, but couldn't load the data: " + (err.message || err), "bad");
    return;
  }
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  paintWhoami();
  if (!booted){ booted = true; }
  open = new Set(); openPhase.clear();
  renderAll();
  listen();
  joinPresence();
}
function paintWhoami(){
  const el = document.getElementById("whoami");
  if (!el || !ME) return;
  el.innerHTML = '<span class="live" id="liveDot"></span>' +
    "<span>" + esc(ME.name) + (CAN_EDIT ? "" : " · read only") + "</span>" +
    avatarHTML(ME.name, 22);
  el.onclick = profileSheet;
  paintPresence();
}

/* Shrink whatever they picked to a small square before it ever goes near
   the database: a phone photo is several megabytes, and this has to sit
   in a row that loads with every page. 160px is plenty for a 26px face
   on a retina screen. */
function shrinkImage(file, px){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("That file couldn't be read."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That doesn't look like an image."));
      img.onload = () => {
        const side = Math.min(img.width, img.height);           /* centre crop to a square */
        const cv = document.createElement("canvas");
        cv.width = cv.height = px;
        const cx = cv.getContext("2d");
        cx.imageSmoothingQuality = "high";
        cx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, px, px);
        let out = "";
        try { out = cv.toDataURL("image/webp", 0.82); } catch(e){}
        if (!out || out.indexOf("data:image/webp") !== 0) out = cv.toDataURL("image/jpeg", 0.82);
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function profileSheet(){
  closeCtx();
  let pending = ME.avatar || "";      /* not saved until Save is pressed */
  const sheet = openSheet(
    '<h3>Your profile</h3>' +
    '<div class="pf-top">' +
      '<div class="pf-av av" id="pfAv"></div>' +
      '<p class="pf-hint" id="pfHint"></p>' +
    "</div>" +
    '<div class="field"><label for="pfName">Display name</label>' +
      '<input type="text" id="pfName" maxlength="40"></div>' +
    '<p class="pf-hint" style="margin-top:-4px;text-align:left">' +
      "This is the name on your comments and in the history.</p>" +
    '<div class="actions">' +
      '<button type="button" class="btn ghostbtn" id="pfOut">Sign out</button>' +
      '<button type="button" class="btn primary" id="pfSave">Save</button>' +
    "</div>");

  const avEl   = sheet.querySelector("#pfAv");
  const hintEl = sheet.querySelector("#pfHint");
  const nameEl = sheet.querySelector("#pfName");
  nameEl.value = ME.name || "";

  const file = document.createElement("input");
  file.type = "file"; file.accept = "image/*"; file.hidden = true;
  sheet.appendChild(file);

  const paintAv = () => {
    const col = personColor(ME.name) || PERSON_COLORS[(ME.color_index || 0) % PERSON_COLORS.length];
    avEl.style.background = pending ? "" : col;
    avEl.innerHTML = (pending ? '<img src="' + esc(pending) + '" alt="">' :
        esc((nameEl.value || "?").trim().slice(0, 1).toUpperCase())) +
      '<span class="pf-edit">Change</span>';
    hintEl.innerHTML = pending
      ? 'Click the picture to swap it · <button type="button" class="pf-clear" id="pfClear">remove</button>'
      : "Click to add a picture. It shows on your comments.";
    const clr = hintEl.querySelector("#pfClear");
    if (clr) clr.onclick = () => { pending = ""; paintAv(); };
  };
  paintAv();

  avEl.onclick = () => file.click();
  nameEl.oninput = () => { if (!pending) paintAv(); };
  file.onchange = async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)){ hintEl.textContent = "That needs to be an image."; return; }
    hintEl.textContent = "Shrinking…";
    try { pending = await shrinkImage(f, 160); paintAv(); }
    catch(err){ hintEl.textContent = err.message || "That image couldn't be used."; }
    file.value = "";
  };

  sheet.querySelector("#pfOut").onclick = async () => {
    if (LIVE) sb.removeChannel(LIVE);
    if (HERE) sb.removeChannel(HERE);
    await sb.auth.signOut();
    location.reload();
  };
  sheet.querySelector("#pfSave").onclick = async () => {
    const nm = nameEl.value.trim();
    if (!nm){ hintEl.textContent = "A name, please."; return; }
    const btn = sheet.querySelector("#pfSave");
    btn.disabled = true; btn.textContent = "Saving…";
    const {error} = await sb.from("profiles")
      .update({name:nm, avatar:pending}).eq("id", ME.id);
    if (error){
      btn.disabled = false; btn.textContent = "Save";
      hintEl.textContent = error.message.indexOf("avatar") >= 0
        ? "The database has no avatar column yet — run the migration."
        : error.message;
      return;
    }
    ME.name = nm; ME.avatar = pending;
    DB.me.name = nm;
    DB.peopleAvatars[nm.toLowerCase()] = pending;
    closeSheet();
    paintWhoami();
    if (HERE) await HERE.track({name:nm, at:new Date().toISOString()});
    scheduleReload();
  };
}

/* ---------- who's on the team ---------- */
async function peopleSheet(){
  const sheet = openSheet(
    "<h3>People</h3>" +
    "<p class='hint'>Anyone on the approved list gets full access the moment " +
    "they create an account. Everyone else can look but not change anything.</p>" +
    '<div id="ppBody"><p class="pp-none">Loading…</p></div>');

  const body = sheet.querySelector("#ppBody");

  const draw = async () => {
    const [profs, allowed] = await Promise.all([
      sb.from("profiles").select("*").order("color_index"),
      sb.from("allowed_emails").select("*")
    ]);
    if (profs.error || allowed.error){
      body.innerHTML = '<p class="pp-none">' +
        esc((profs.error || allowed.error).message) + "</p>";
      return;
    }
    PROFILES = profs.data;
    const registered = {};
    profs.data.forEach(p => { if (p.email) registered[p.email.toLowerCase()] = true; });
    const waiting = allowed.data
      .map(a => a.email)
      .filter(e => e && !registered[e.toLowerCase()])
      .sort();

    const onlineIds = {};
    ONLINE.forEach(o => { onlineIds[o.id] = true; });

    let html = '<p class="pp-head first">Accounts</p>';
    html += profs.data.map(p => {
      const nm = (p.name || p.email || "").trim();
      const me = ME && p.id === ME.id;
      return '<div class="pp-row">' + avatarHTML(nm, 30) +
        "<div><div class='pp-name'>" + esc(nm) + (me ? " <span class='pp-sub'>· you</span>" : "") +
          (onlineIds[p.id] ? " <span class='live' style='display:inline-block'></span>" : "") +
          "</div>" +
        "<div class='pp-sub'>" + esc(p.email || "") + "</div></div>" +
        '<button type="button" class="pp-tag' + (p.is_admin ? " admin" : "") +
          (me ? " locked" : "") + '" data-id="' + esc(p.id) + '" data-admin="' +
          (p.is_admin ? "1" : "0") + '"' + (me ? " disabled" : "") + ">" +
          (p.is_admin ? "Full access" : "Read only") + "</button></div>";
    }).join("");

    html += '<p class="pp-head">Approved, not yet registered</p>';
    html += waiting.length
      ? waiting.map(e =>
          '<div class="pp-row"><div><div class="pp-name">' + esc(e) + "</div>" +
          "<div class='pp-sub'>can create an account with full access</div></div>" +
          '<button type="button" class="pp-x" data-drop="' + esc(e) +
          '" aria-label="Remove">' + XMARK + "</button></div>").join("")
      : '<p class="pp-none">Nobody waiting.</p>';

    html += '<div class="pp-add"><input type="email" id="ppNew" ' +
      'placeholder="colleague@churchofjesuschrist.org">' +
      '<button type="button" class="btn primary" id="ppAdd">Approve</button></div>';

    body.innerHTML = html;

    /* full access <-> read only */
    body.querySelectorAll(".pp-tag:not(.locked)").forEach(b => {
      b.onclick = async () => {
        const makeAdmin = b.dataset.admin !== "1";
        b.disabled = true;
        const {error} = await sb.from("profiles")
          .update({is_admin: makeAdmin}).eq("id", b.dataset.id);
        if (error){ b.disabled = false; alertNote(error.message); return; }
        draw();
      };
    });

    /* un-approve someone who hasn't signed up yet */
    body.querySelectorAll("[data-drop]").forEach(b => {
      b.onclick = () => {
        const em = b.dataset.drop;
        confirmAsk("Remove " + esc(em) + "?",
          "They won't be able to create an account with full access. " +
          "You can approve them again at any time.", "Remove", async () => {
            await sb.from("allowed_emails").delete().eq("email", em);
            draw();
          });
      };
    });

    /* approve a new address */
    const inp = body.querySelector("#ppNew");
    const add = body.querySelector("#ppAdd");
    const submit = async () => {
      const em = (inp.value || "").trim().toLowerCase();
      if (!em) return;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){
        inp.focus(); alertNote("That doesn't look like an email address."); return;
      }
      add.disabled = true;
      const {error} = await sb.from("allowed_emails").upsert({email: em});
      add.disabled = false;
      if (error){ alertNote(error.message); return; }
      /* already has an account? promote them straight away */
      const hit = profs.data.find(p => (p.email || "").toLowerCase() === em);
      if (hit && !hit.is_admin)
        await sb.from("profiles").update({is_admin: true}).eq("id", hit.id);
      inp.value = "";
      draw();
    };
    add.onclick = submit;
    inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); submit(); } };
  };

  draw();
}
/* a one-line message inside the open sheet, rather than a browser alert */
function alertNote(msg){
  const b = document.getElementById("ppBody");
  if (!b) return;
  let n = b.querySelector(".pp-note");
  if (!n){
    n = document.createElement("p");
    n.className = "pp-none pp-note";
    n.style.color = "var(--danger)";
    b.insertBefore(n, b.firstChild);
  }
  n.textContent = msg;
}

/* Supabase speaks in developer; translate for the office. */
function plainAuthError(msg){
  const m = String(msg || "").toLowerCase();
  if (m.includes("invalid login credentials"))
    return "That email and password don't match an account. Check the password, or create the account first.";
  if (m.includes("email not confirmed"))
    return "This account still needs confirming. In Supabase go to Authentication \u2192 Users, open your row and confirm it \u2014 or turn off \u201cConfirm email\u201d under Sign In / Providers first.";
  if (m.includes("already registered") || m.includes("already exists"))
    return "There's already an account with that address. Switch to Sign in.";
  if (m.includes("password should be"))
    return "Password needs to be at least 6 characters.";
  if (m.includes("failed to fetch") || m.includes("networkerror"))
    return "Can't reach the database. Check your connection and try again.";
  return msg || "Something went wrong.";
}

function wireGate(){
  const email = document.getElementById("gEmail");
  const pass  = document.getElementById("gPass");
  const pass2 = document.getElementById("gPass2");
  const wrap2 = document.getElementById("gPass2Wrap");
  const go    = document.getElementById("gGo");
  const alt   = document.getElementById("gAlt");
  let mode = "in";

  [["gEye", pass], ["gEye2", pass2]].forEach(([id, input]) => {
    const b = document.getElementById(id);
    b.innerHTML = EYE_ON;
    b.onclick = () => {
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      b.innerHTML = show ? EYE_OFF : EYE_ON;
      b.setAttribute("aria-label", show ? "Hide password" : "Show password");
      input.focus();
    };
  });

  const setMode = (m, keepMsg) => {
    mode = m;
    document.getElementById("gTitle").textContent = m === "in" ? "Local Pages" : "Create your account";
    document.getElementById("gSub").textContent = m === "in"
      ? "Sign in to see and update this month."
      : "Use your work address. Approved addresses can edit; anyone else can look but not touch.";
    go.textContent = m === "in" ? "Sign in" : "Create account";
    wrap2.hidden = m === "in";
    pass.setAttribute("autocomplete", m === "in" ? "current-password" : "new-password");
    alt.innerHTML = m === "in"
      ? 'No account yet? <button type="button" id="gSwap">Create one</button>'
      : 'Already have one? <button type="button" id="gSwap">Sign in</button>';
    document.getElementById("gSwap").onclick = () => setMode(m === "in" ? "up" : "in");
    if (!keepMsg) gateMsg("");
  };
  setMode("in");

  const submit = async () => {
    const e = email.value.trim(), p = pass.value;
    if (!e || !p){ gateMsg("Email and password, please.", "bad"); return; }
    if (mode === "up"){
      if (p.length < 6){ gateMsg("Password needs to be at least 6 characters.", "bad"); return; }
      if (p !== pass2.value){ gateMsg("The two passwords don't match.", "bad"); pass2.focus(); return; }
    }
    go.disabled = true;
    const label = go.textContent;
    go.innerHTML = '<span class="spin"></span>';
    gateMsg("");
    try {
      const r = mode === "in"
        ? await sb.auth.signInWithPassword({email:e, password:p})
        : await sb.auth.signUp({email:e, password:p});
      if (r.error){
        console.error(r.error);
        gateMsg(plainAuthError(r.error.message), "bad");
        return;
      }
      if (r.data && r.data.session){ await afterSignIn(r.data.session); return; }
      /* signed up but no session: confirmation is switched on */
      setMode("in", true);
      pass2.value = "";
      gateMsg("Account created \u2014 now confirm it, then sign in. If you didn't get an email, confirm the account yourself in Supabase \u2192 Authentication \u2192 Users.", "ok");
    } catch(err){
      console.error(err);
      gateMsg(plainAuthError(err && err.message), "bad");
    } finally {
      go.disabled = false;
      go.textContent = mode === "in" ? "Sign in" : "Create account";
    }
  };
  go.onclick = submit;
  [email, pass, pass2].forEach(i => { i.onkeydown = ev => { if (ev.key === "Enter") submit(); }; });
}

/* ---------- start ---------- */
(async function start(){
  document.getElementById("mark").innerHTML = LOGO;
  document.getElementById("gateMark").innerHTML = LOGO;
  document.getElementById("ver").textContent = APP_VERSION;
  document.getElementById("gateVer").textContent = APP_VERSION;
  document.getElementById("cog").innerHTML = DOTS;
  document.getElementById("cog").onclick = e => { e.stopPropagation(); openCog(); };
  buildRailBig();
  wireGate();
  const {data} = await sb.auth.getSession();
  if (data && data.session) await afterSignIn(data.session);
  else document.getElementById("gate").hidden = false;
})();

</script>
